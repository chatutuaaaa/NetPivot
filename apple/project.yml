name: NetPivot
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: iphoneos
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  WireGuardKit:
    path: Dependencies/wireguard-apple
targets:
  NetPivot:
    type: application
    platform: iOS
    sources:
      - NetPivotApp
      - Shared
    dependencies:
      - target: PacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NETPIVOT_APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/NetPivot.entitlements
    info:
      path: Config/NetPivot-Info.plist
      properties:
        CFBundleDisplayName: NetPivot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: 扫描朋友分享的 NetPivot 邀请二维码。
        NSLocalNetworkUsageDescription: 检查 NetPivot 虚拟网络节点是否可以收发数据。
        NetPivotHost: $(NETPIVOT_HOST)
        NetPivotTunnelID: $(NETPIVOT_APP_BUNDLE_ID).tunnel
        NetPivotAppGroup: group.$(NETPIVOT_APP_BUNDLE_ID)
        NetPivotKeychainGroup: $(NETPIVOT_APP_IDENTIFIER_PREFIX).$(NETPIVOT_APP_BUNDLE_ID).shared
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      - Shared
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NETPIVOT_APP_BUNDLE_ID).tunnel
        CODE_SIGN_ENTITLEMENTS: Config/PacketTunnel.entitlements
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(CONFIGURATION_BUILD_DIR)"]
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    preBuildScripts:
      - name: Build pinned WireGuard Go bridge
        path: scripts/build-wg.sh
        shell: /bin/bash
        basedOnDependencyAnalysis: false
    info:
      path: Config/PacketTunnel-Info.plist
      properties:
        NetPivotHost: $(NETPIVOT_HOST)
        NetPivotAppGroup: group.$(NETPIVOT_APP_BUNDLE_ID)
        NetPivotKeychainGroup: $(NETPIVOT_APP_IDENTIFIER_PREFIX).$(NETPIVOT_APP_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
schemes:
  NetPivot:
    build:
      targets:
        NetPivot: all
    run:
      config: Debug
    archive:
      config: Release
